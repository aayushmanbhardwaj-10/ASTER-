name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript foundation dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Architecture guard
        run: npm run architecture:test
      - name: Contract semantic checks
        run: npm run contract:test

  python-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Intelligence API dependencies
        run: python -m pip install -e ./apps/intelligence-api
      - name: Import check
        run: python -c "import importlib.util; spec = importlib.util.spec_from_file_location('aster_intelligence_main', 'apps/intelligence-api/src/main.py'); module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module); print(module.app.title)"
